syntax = "proto3";

package order_engine;

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc ExecuteOrder(ExecuteOrderRequest) returns (ExecuteOrderResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
}

message CreateOrderRequest {
  string wallet_id = 1;
  string asset_symbol = 2;
  string side = 3;  // ACHAT ou VENTE
  string quantity = 4;
  string price = 5;  // Optionnel, si non défini -> ordre au marché
  string idempotency_key = 6;
}

message CreateOrderResponse {
  string order_id = 1;
  string status = 2;
  string message = 3;
}

message ExecuteOrderRequest {
  string order_id = 1;
  string execution_price = 2;
  string executed_quantity = 3;
}

message ExecuteOrderResponse {
  string order_id = 1;
  string status = 2;
  string message = 3;
  string trade_id = 4;
}

message GetOrderRequest {
  string order_id = 1;
}

message GetOrderResponse {
  string order_id = 1;
  string wallet_id = 2;
  string asset_symbol = 3;
  string side = 4;
  string quantity = 5;
  string price = 6;
  string status = 7;
  string filled_quantity = 8;
  string created_at = 9;
}

message ListOrdersRequest {
  string wallet_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  int32 total = 2;
}

message Order {
  string order_id = 1;
  string wallet_id = 2;
  string asset_symbol = 3;
  string side = 4;
  string quantity = 5;
  string price = 6;
  string status = 7;
  string filled_quantity = 8;
  string created_at = 9;
}
